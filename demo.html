<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Live demo</title>
  <!-- Link previews (Slack, Discord, etc.) will show this, not the payload -->
  <meta property="og:title" content="Live demo">
  <meta property="og:description" content="Interactive preview of the latest build.">
  <style>
    :root {
      --bg: #ffffff; --fg: #1f2328; --muted: #59636e;
      --line: #d1d9e0; --btn: #1f883d; --btn-hover: #1a7f37;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #0d1117; --fg: #e6edf3; --muted: #9198a1;
              --line: #3d444d; --btn: #238636; --btn-hover: #2ea043; }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: var(--bg); color: var(--fg);
      font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    }
    main { width: min(420px, 90vw); text-align: center; }
    h1 { font-size: 22px; font-weight: 600; margin: 0 0 6px; }
    p { color: var(--muted); margin: 0 0 20px; }
    .bar { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; margin-bottom: 20px; }
    .bar span { display: block; height: 100%; width: 0; background: var(--btn); transition: width .4s ease; }
    button {
      font: inherit; font-weight: 600; color: #fff; background: var(--btn);
      border: 0; border-radius: 6px; padding: 8px 18px; cursor: pointer;
      opacity: .5; pointer-events: none;
    }
    button.ready { opacity: 1; pointer-events: auto; }
    button:hover { background: var(--btn-hover); }
    button:focus-visible { outline: 2px solid #0969da; outline-offset: 2px; }
    #stage { position: fixed; inset: 0; background: #000; display: none; }
    #stage iframe { width: 100%; height: 100%; border: 0; }
  </style>
</head>
<body>
  <main>
    <h1>Preparing demo</h1>
    <p id="status">Fetching build artifacts…</p>
    <div class="bar"><span id="progress"></span></div>
    <button id="launch" type="button">Launch demo</button>
  </main>

  <div id="stage"></div>

  <script>
    const VIDEO_ID = "dQw4w9WgXcQ";
    const steps = [
      "Fetching build artifacts…",
      "Installing dependencies…",
      "Compiling assets…",
      "Demo ready."
    ];
    const status = document.getElementById("status");
    const progress = document.getElementById("progress");
    const launch = document.getElementById("launch");

    // Fake loading sequence to sell it
    steps.forEach((text, i) => {
      setTimeout(() => {
        status.textContent = text;
        progress.style.width = ((i + 1) / steps.length * 100) + "%";
        if (i === steps.length - 1) launch.classList.add("ready");
      }, 700 * (i + 1));
    });

    // The click counts as a user gesture, so browsers allow autoplay WITH sound
    launch.addEventListener("click", () => {
      const stage = document.getElementById("stage");
      stage.innerHTML =
        `<iframe src="https://www.youtube.com/embed/${VIDEO_ID}?autoplay=1&controls=0&rel=0"
                 allow="autoplay; fullscreen" allowfullscreen></iframe>`;
      stage.style.display = "block";
      stage.requestFullscreen?.().catch(() => {});
      document.title = "Never gonna…";
    });
  </script>
</body>
</html>
